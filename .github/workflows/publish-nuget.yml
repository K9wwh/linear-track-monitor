name: Publish to NuGet

# Runs when a GitHub release is published, or manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # WPF (UseWPF / net10.0-windows) can only be built on Windows.
    runs-on: windows-latest

    permissions:
      id-token: write   # required: lets GitHub issue the OIDC token NuGet exchanges for a short-lived key
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack TrackMonitor.Controls/TrackMonitor.Controls.csproj -c Release -o nupkg

      # Exchange the OIDC token for a temporary nuget.org API key (valid 1 hour).
      # `user` is the nuget.org profile name, not an email address.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: KW994

      # Resolve the .nupkg explicitly: PowerShell (the default shell on Windows
      # runners) does not expand globs into arguments, so passing nupkg/*.nupkg
      # straight to dotnet fails with "File does not exist".
      - name: Push
        shell: pwsh
        run: |
          $pkg = Get-ChildItem nupkg/*.nupkg | Select-Object -First 1
          if (-not $pkg) { throw "No .nupkg found in nupkg/" }
          Write-Host "Pushing $($pkg.Name)"
          dotnet nuget push $pkg.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
